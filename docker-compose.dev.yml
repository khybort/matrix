# Dev overrides — hot-reload every Python service + Next.js HMR for web.
#
# Source dirs are bind-mounted INTO the image at the same path they live in
# the build context. Each editable-installed package's .venv (created during
# image build) stays intact because it lives at .venv/, not src/. As a result,
# any Python file change triggers watchfiles to restart the process — no
# rebuild required.
#
# Python reload uses matrix_shared.dev_watchfiles (2.5s debounce, 2s post-start
# grace, ignores tests/__pycache__) instead of the stock watchfiles CLI — see
# packages/python-shared/src/matrix_shared/dev_watchfiles.py.
#
# The web service swaps to the `dev` stage in apps/web/Dockerfile, which
# runs `pnpm dev` for full HMR.

x-matrix-dev-watch: &matrix-dev-watch
  entrypoint: ["uv", "run", "--with", "watchfiles", "python", "-m", "matrix_shared.dev_watchfiles"]

# For `make llm-cursor`: persist container `agent login` state across restarts.
# Do NOT mount ~/.local/share/cursor-agent from the host — on macOS that replaces
# the in-image Linux CLI with Mach-O binaries (Exec format error in Docker).
# Host `cursor agent login` does not propagate to Linux containers; use
# `docker exec -it matrix-agent agent login` once, or set CURSOR_API_KEY in .env.
x-cursor-agent-auth-volume: &cursor-agent-auth-volume matrix_cursor_agent:/root/.cursor

services:
  # Python services — common pattern: mount src dirs + wrap CMD with watchfiles
  # Unified ingestion (Phase F): one container fans out into every
  # registered MarketAdapter's IngestorAdapter (crypto Bybit ws + BIST
  # yfinance poller). Crypto symbols still passed explicitly for parity
  # with the historical default; BIST universe comes from bist_symbols.
  ingestion-market:
    <<: *matrix-dev-watch
    command:
      - "python -m ingestion.main --markets crypto bist --mainnet"
      - "/workspace/services/ingestion/src"
      - "/workspace/packages/python-shared/src"
    volumes:
      - ./services/ingestion/src:/workspace/services/ingestion/src
      - ./packages/python-shared/src:/workspace/packages/python-shared/src

  ingestion-news:
    <<: *matrix-dev-watch
    command:
      - "python -m ingestion.news --interval 300"
      - "/workspace/services/ingestion/src"
      - "/workspace/packages/python-shared/src"
    volumes:
      - ./services/ingestion/src:/workspace/services/ingestion/src
      - ./packages/python-shared/src:/workspace/packages/python-shared/src

  bars-aggregator:
    <<: *matrix-dev-watch
    command:
      - "python -m ingestion.bars --interval 60 --lookback-minutes 5"
      - "/workspace/services/ingestion/src"
      - "/workspace/packages/python-shared/src"
    volumes:
      - ./services/ingestion/src:/workspace/services/ingestion/src
      - ./packages/python-shared/src:/workspace/packages/python-shared/src

  graph:
    <<: *matrix-dev-watch
    command:
      - "python -m graph.main --interval 60"
      - "/workspace/services/graph/src"
      - "/workspace/packages/python-shared/src"
    volumes:
      - ./services/graph/src:/workspace/services/graph/src
      - ./packages/python-shared/src:/workspace/packages/python-shared/src
      - *cursor-agent-auth-volume

  agent:
    <<: *matrix-dev-watch
    command:
      - "python -m agent.main --interval 15"
      - "/workspace/services/agent/src"
      - "/workspace/services/graph/src"
      - "/workspace/packages/python-shared/src"
    volumes:
      - ./services/agent/src:/workspace/services/agent/src
      - ./services/graph/src:/workspace/services/graph/src
      - ./packages/python-shared/src:/workspace/packages/python-shared/src
      - *cursor-agent-auth-volume

  strategy:
    <<: *matrix-dev-watch
    command:
      - "python -m strategy.main --interval 30"
      - "/workspace/services/strategy/src"
      - "/workspace/packages/python-shared/src"
    volumes:
      - ./services/strategy/src:/workspace/services/strategy/src
      - ./packages/python-shared/src:/workspace/packages/python-shared/src

  agent-lessons:
    <<: *matrix-dev-watch
    command:
      - "python -m agent_lessons.main"
      - "/workspace/services/agent_lessons/src"
      - "/workspace/packages/python-shared/src"
    volumes:
      - ./services/agent_lessons/src:/workspace/services/agent_lessons/src
      - ./packages/python-shared/src:/workspace/packages/python-shared/src

  backtest-api:
    <<: *matrix-dev-watch
    command:
      - "python -m backtest.api"
      - "/workspace/services/backtest/src"
      - "/workspace/packages/python-shared/src"
    volumes:
      - ./services/backtest/src:/workspace/services/backtest/src
      - ./packages/python-shared/src:/workspace/packages/python-shared/src

  backtest:
    <<: *matrix-dev-watch
    command:
      - "python -m backtest.main --interval 5"
      - "/workspace/services/backtest/src"
      - "/workspace/packages/python-shared/src"
    volumes:
      - ./services/backtest/src:/workspace/services/backtest/src
      - ./packages/python-shared/src:/workspace/packages/python-shared/src

  reflection:
    <<: *matrix-dev-watch
    command:
      - "python -m reflection.main --interval 600 --no-llm"
      - "/workspace/services/reflection/src"
      - "/workspace/packages/python-shared/src"
    volumes:
      - ./services/reflection/src:/workspace/services/reflection/src
      - ./packages/python-shared/src:/workspace/packages/python-shared/src
      - *cursor-agent-auth-volume

  labs:
    <<: *matrix-dev-watch
    command:
      - "python -m labs.main --eval-interval 20 --evolve-interval 300 --promote-scan-interval 600 --auto-apply-safe"
      - "/workspace/services/labs/src"
      - "/workspace/services/agent/src"
      - "/workspace/services/graph/src"
      - "/workspace/packages/python-shared/src"
    volumes:
      - ./services/labs/src:/workspace/services/labs/src
      - ./services/agent/src:/workspace/services/agent/src
      - ./services/graph/src:/workspace/services/graph/src
      - ./packages/python-shared/src:/workspace/packages/python-shared/src

  synthesis:
    <<: *matrix-dev-watch
    command:
      - "python -m synthesis.main --interval 3600 --hours 6"
      - "/workspace/services/synthesis/src"
      - "/workspace/services/graph/src"
      - "/workspace/packages/python-shared/src"
    volumes:
      - ./services/synthesis/src:/workspace/services/synthesis/src
      - ./services/graph/src:/workspace/services/graph/src
      - ./packages/python-shared/src:/workspace/packages/python-shared/src
      - *cursor-agent-auth-volume

  dev_agent:
    # Dev safety: force the spawned `claude` CLI onto subscription auth so a
    # prod ANTHROPIC_API_KEY in .env can never burn API credits during local
    # iteration. Prod compose leaves both env vars passthrough — operator
    # picks via .env.
    environment:
      ANTHROPIC_API_KEY: ""
    <<: *matrix-dev-watch
    command:
      - "python -m dev_agent.main"
      - "/workspace/services/dev_agent/src"
      - "/workspace/packages/python-shared/src"
    volumes:
      - ./services/dev_agent/src:/workspace/services/dev_agent/src
      - ./packages/python-shared/src:/workspace/packages/python-shared/src

  brain:
    # Dev safety: force the spawned `claude` CLI onto subscription auth.
    environment:
      ANTHROPIC_API_KEY: ""
    <<: *matrix-dev-watch
    command:
      - "python -m brain.main"
      - "/workspace/services/brain/src"
      - "/workspace/packages/python-shared/src"
    # Host port so the chat SSE endpoint can be curled directly during dev.
    ports:
      - "3032:3032"
    volumes:
      - ./services/brain/src:/workspace/services/brain/src
      - ./packages/python-shared/src:/workspace/packages/python-shared/src
      - *cursor-agent-auth-volume

  web:
    build:
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/next.config.ts:/app/apps/web/next.config.ts
      - ./apps/web/tsconfig.json:/app/apps/web/tsconfig.json
      - ./apps/web/next-env.d.ts:/app/apps/web/next-env.d.ts
      - ./apps/web/postcss.config.js:/app/apps/web/postcss.config.js

volumes:
  matrix_cursor_agent:
    name: matrix_cursor_agent

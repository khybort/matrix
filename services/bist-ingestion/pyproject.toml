[project]
name = "matrix-bist-ingestion"
version = "0.0.1"
description = "BIST (Borsa Istanbul) market data ingestion via yfinance."
requires-python = ">=3.13"
dependencies = [
    "matrix-shared",
    "yfinance>=0.2.50",
    "pandas>=2.2.0",
    "loguru>=0.7.3",
]

[tool.uv.sources]
matrix-shared = { path = "../../packages/python-shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bist_ingestion"]

[project.scripts]
matrix-bist-bars = "bist_ingestion.bars:main"
matrix-bist-symbols = "bist_ingestion.symbols:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

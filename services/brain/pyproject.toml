[project]
name = "matrix-brain"
version = "0.0.1"
description = "Matrix Brain — Opus-4.7 read-only 'ask anything' agent over graph + state."
requires-python = ">=3.13"
dependencies = [
    "matrix-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "asyncpg>=0.30.0",
    "claude-agent-sdk>=0.0.10",
    "orjson>=3.10.0",
    "pydantic>=2.10.0",
    "loguru>=0.7.3",
]

[tool.uv.sources]
matrix-shared = { path = "../../packages/python-shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

[project.scripts]
matrix-brain = "brain.main:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

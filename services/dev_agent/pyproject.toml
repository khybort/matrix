[project]
name = "matrix-dev-agent"
version = "0.0.1"
description = "Self-improving development agent that drives Claude Code via the Agent SDK."
requires-python = ">=3.13"
dependencies = [
    "matrix-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "pgvector>=0.3.6",
    "claude-agent-sdk>=0.0.10",
    "httpx>=0.28.0",
    "orjson>=3.10.0",
    "pydantic>=2.10.0",
    "loguru>=0.7.3",
    "pyyaml>=6.0.2",
]

[tool.uv.sources]
matrix-shared = { path = "../../packages/python-shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_agent"]

[project.scripts]
matrix-dev-agent = "dev_agent.main:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: requires real Anthropic API key and a running dev_agent stack",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-postgresql>=6.1.0",
    "httpx>=0.28.0",
    "ruff>=0.7.0",
    "psycopg[binary]>=3.2",
]

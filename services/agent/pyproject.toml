[project]
name = "matrix-agent"
version = "0.0.1"
description = "Multi-signal decision agent (rule-based + optional LLM)."
requires-python = ">=3.13"
dependencies = [
    "matrix-shared",
    "matrix-graph",
    "httpx>=0.28.0",
    "orjson>=3.10.0",
    "loguru>=0.7.3",
]

[tool.uv.sources]
matrix-shared = { path = "../../packages/python-shared", editable = true }
matrix-graph = { path = "../graph", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[project.scripts]
matrix-agent = "agent.main:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

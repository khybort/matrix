[project]
name = "matrix-graph"
version = "0.0.1"
description = "Entity/relation extraction + Apache AGE upsert."
requires-python = ">=3.13"
dependencies = [
    "matrix-shared",
    "httpx>=0.28.0",
    "orjson>=3.10.0",
    "loguru>=0.7.3",
]

[tool.uv.sources]
matrix-shared = { path = "../../packages/python-shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph"]

[project.scripts]
matrix-graph = "graph.main:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

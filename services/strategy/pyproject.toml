[project]
name = "matrix-strategy"
version = "0.0.1"
description = "Strategy modules + predictor loop for Matrix."
requires-python = ">=3.13"
dependencies = [
    "matrix-shared",
    "loguru>=0.7.3",
]

[tool.uv.sources]
matrix-shared = { path = "../../packages/python-shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strategy"]

[project.scripts]
matrix-strategy = "strategy.main:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

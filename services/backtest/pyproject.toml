[project]
name = "matrix-backtest"
version = "0.0.1"
description = "Paper-trade engine + outcome scoring + (later) historical backtest."
requires-python = ">=3.13"
dependencies = [
    "matrix-shared",
    "loguru>=0.7.3",
]

[tool.uv.sources]
matrix-shared = { path = "../../packages/python-shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtest"]

[project.scripts]
matrix-backtest = "backtest.main:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# matrix_shared.db caches the async engine via lru_cache; pinning the loop
# to the whole session keeps the cached engine bound to a single live loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

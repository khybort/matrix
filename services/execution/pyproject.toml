[project]
name = "matrix-execution"
version = "0.0.1"
description = "Live-execution gateway. Phase 0 skeleton: gates only, no broker integration."
requires-python = ">=3.13"
dependencies = [
    "matrix-shared",
    "httpx>=0.28.0",
    "loguru>=0.7.3",
]

[tool.uv.sources]
matrix-shared = { path = "../../packages/python-shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/execution"]

[project.scripts]
matrix-execution = "execution.main:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# matrix_shared.db caches the async engine via lru_cache; pinning the event
# loop to the whole session keeps the cached engine bound to a single live
# loop. Without this, the second test triggers "Event loop is closed" at
# teardown when sqlalchemy tries to use the engine from the first test's loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

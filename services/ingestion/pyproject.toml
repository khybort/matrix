[project]
name = "matrix-ingestion"
version = "0.0.1"
description = "Market data + news ingestion connectors for Matrix."
requires-python = ">=3.13"
dependencies = [
    "matrix-shared",
    "websockets>=14.1",
    "httpx>=0.28.0",
    "orjson>=3.10.0",
    "loguru>=0.7.3",
]

[tool.uv.sources]
matrix-shared = { path = "../../packages/python-shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[project.scripts]
matrix-ingest = "ingestion.main:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

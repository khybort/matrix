# Matrix base compose — defines the topology and the prod-ish baseline.
#
# Use:
#   make up-dev     → adds docker-compose.dev.yml (hot reload, source mounts)
#   make up-prod    → adds docker-compose.prod.yml (built images, restart policies)
#   docker compose up postgres   → just the DB
#
# Env via .env at repo root (gitignored). See .env.example.

name: matrix

# Default logging policy — caps every container's json log file so a
# runaway log can never fill the host disk again (we hit that in this repo).
# Per-service overrides allowed.
x-logging: &default_logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-python-build: &python-build
  context: .
  dockerfile: Dockerfile

x-python-env: &python-env
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  LOCAL_DATABASE_URL: ${LOCAL_DATABASE_URL:-postgres://matrix:matrix_dev_only@postgres:5432/matrix}
  SHARED_DATABASE_URL: ${SHARED_DATABASE_URL:-postgres://matrix:matrix_dev_only@postgres:5432/matrix}
  DATABASE_URL: ${LOCAL_DATABASE_URL:-postgres://matrix:matrix_dev_only@postgres:5432/matrix}
  # All LLM calls route via subscription (claude_agent_sdk) since 2026-05-26.
  # API keys kept as passthroughs but blanked in .env. See feedback_subscription_only.md.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
  CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
  # Alternative LLM backends. Set CLAUDE_CODE_USE_BEDROCK=1 (or USE_VERTEX=1)
  # in .env to route the SDK's spawned `claude` CLI through AWS Bedrock or
  # Google Vertex instead of the Anthropic subscription. Standard AWS env
  # vars pass through. Model IDs differ on Bedrock/Vertex — override via
  # MATRIX_MODEL_<HAIKU|SONNET|OPUS> with the provider-specific identifier
  # (e.g. MATRIX_MODEL_SONNET=us.anthropic.claude-sonnet-4-6-20250929-v1:0).
  CLAUDE_CODE_USE_BEDROCK: ${CLAUDE_CODE_USE_BEDROCK:-}
  CLAUDE_CODE_USE_VERTEX: ${CLAUDE_CODE_USE_VERTEX:-}
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  AWS_PROFILE: ${AWS_PROFILE:-}
  MATRIX_MODEL_HAIKU: ${MATRIX_MODEL_HAIKU:-}
  MATRIX_MODEL_SONNET: ${MATRIX_MODEL_SONNET:-}
  MATRIX_MODEL_OPUS: ${MATRIX_MODEL_OPUS:-}
  NODE_ID: ${NODE_ID:-default-node}
  NODE_ROLES: ${NODE_ROLES:-dev,ingestion,graph,strategy,backtest,reflection,labs}
  MAX_POSITION_PCT: ${MAX_POSITION_PCT:-2.0}
  DAILY_LOSS_CIRCUIT_PCT: ${DAILY_LOSS_CIRCUIT_PCT:-5.0}
  LIVE_CAPITAL_CAP_USD: ${LIVE_CAPITAL_CAP_USD:-2000}
  LIVE_EXECUTION_ENABLED: "false"

services:
  postgres:
    build:
      context: ./infra/db
    image: matrix-postgres:local
    container_name: matrix-postgres
    environment:
      POSTGRES_USER: matrix
      POSTGRES_PASSWORD: matrix_dev_only
      POSTGRES_DB: matrix
    ports:
      - "5432:5432"
    volumes:
      - matrix_pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrix -d matrix"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *default_logging

  # One-shot Alembic migration runner. Used via `make migrate`.
  migrate:
    build:
      context: .
      dockerfile: infra/db/Dockerfile.migrate
    image: matrix-migrate:local
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *python-env

  ingestion-market:
    build:
      <<: *python-build
      target: runtime
      args:
        SERVICE: ingestion
    image: matrix-ingestion:local
    container_name: matrix-ingestion-market
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *python-env
    command: ["ingestion.main", "BTCUSDT", "ETHUSDT", "--mainnet"]
    restart: unless-stopped
    logging: *default_logging

  ingestion-news:
    image: matrix-ingestion:local
    container_name: matrix-ingestion-news
    depends_on:
      postgres:
        condition: service_healthy
      ingestion-market:
        condition: service_started
    environment:
      <<: *python-env
    command: ["ingestion.news", "--interval", "300"]
    restart: unless-stopped
    logging: *default_logging

  # 1-minute OHLCV aggregator: market_trades → market_bars. Runs as its own
  # process so a connector restart doesn't pause bar generation, and the
  # other way around. The SQL is idempotent (UPSERT on (symbol,interval,ts)),
  # so the 5-minute re-aggregation window safely handles late-arriving trades.
  bars-aggregator:
    image: matrix-ingestion:local
    container_name: matrix-bars-aggregator
    depends_on:
      postgres:
        condition: service_healthy
      ingestion-market:
        condition: service_started
    environment:
      <<: *python-env
    command: ["ingestion.bars", "--interval", "60", "--lookback-minutes", "5"]
    restart: unless-stopped
    logging: *default_logging

  # BIST (Borsa Istanbul) equities live alongside crypto in the unified
  # `ingestion` service above (Phase F). The yfinance bar poller is now
  # an asyncio task inside ingestion.main.

  graph:
    build:
      <<: *python-build
      target: runtime
      args:
        SERVICE: graph
    image: matrix-graph:local
    container_name: matrix-graph
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *python-env
    command: ["graph.main", "--interval", "60"]
    restart: unless-stopped
    logging: *default_logging

  agent:
    build:
      <<: *python-build
      target: runtime
      args:
        SERVICE: agent
    image: matrix-agent:local
    container_name: matrix-agent
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *python-env
    command: ["agent.main", "--interval", "15"]
    restart: unless-stopped

  # Continuous lesson synthesizer. Reads matrix_agent's past decisions +
  # outcomes hourly; writes agent_lessons rows describing patterns where
  # win rate strays from chance. Read-only on the agent itself — the
  # agent will (with operator direction) consume these in decide().
  agent-lessons:
    build:
      <<: *python-build
      target: runtime
      args:
        SERVICE: agent_lessons
    image: matrix-agent-lessons:local
    container_name: matrix-agent-lessons
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *python-env
    command: ["agent_lessons.main"]
    restart: unless-stopped
    logging: *default_logging

  # Weekly bulletin generator. Composes a markdown digest from engine state
  # via Claude Haiku (falls back to a deterministic template if LLM disabled)
  # and writes a draft row. Operator publishes via `matrix-bulletin --publish`.
  # BULLETIN_AUTO_PUBLISH=true skips the manual gate (use with caution).
  bulletin:
    build:
      <<: *python-build
      target: runtime
      args:
        SERVICE: bulletin
    image: matrix-bulletin:local
    container_name: matrix-bulletin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *python-env
      BULLETIN_AUTO_PUBLISH: ${BULLETIN_AUTO_PUBLISH:-false}
    command: ["bulletin.main"]
    restart: unless-stopped
    # Bulletin is the Phase 6+ deferred product (CLAUDE.md). Until then the
    # weekly compose call is pure idle cost. Bring it up explicitly with
    # `docker compose --profile phase6 up -d bulletin` when needed.
    profiles: ["phase6"]
    logging: *default_logging

  # Telegram bot: alert push (circuit/cert/live-flag/equity drop) + /status,
  # /strategies, /circuit, /help commands. Read-only — never submits orders.
  # TELEGRAM_BOT_TOKEN unset → dry-run (logs alerts, no push).
  notify:
    build:
      <<: *python-build
      target: runtime
      args:
        SERVICE: notify
    image: matrix-notify:local
    container_name: matrix-notify
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *python-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
    command: ["notify.main", "--poll-interval", "60"]
    restart: unless-stopped
    # Bring up when TELEGRAM_BOT_TOKEN is set: docker compose --profile notify up -d notify
    profiles: ["notify"]
    logging: *default_logging

  # Live-execution gateway (Phase 0 skeleton). Loops idle, logs "GATE CLOSED"
  # every heartbeat. The composite gate (execution.safety.should_submit_live)
  # is imported & exercised by the test suite; broker hookup lands in Phase 5.
  # Critical: when broker code is added, it MUST go through that gate.
  execution:
    build:
      <<: *python-build
      target: runtime
      args:
        SERVICE: execution
    image: matrix-execution:local
    container_name: matrix-execution
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *python-env
      # Defaults to false in *python-env; surfaced here so an operator
      # editing this file sees the gate is intentionally closed.
      LIVE_EXECUTION_ENABLED: ${LIVE_EXECUTION_ENABLED:-false}
    command: ["execution.main", "--heartbeat", "60"]
    restart: unless-stopped
    # Idle skeleton until Phase 5 broker code lands. Start explicitly:
    # docker compose --profile phase5 up -d execution
    profiles: ["phase5"]
    logging: *default_logging

  # Rule-based strategy generator pool. Each module emits PredictionDraft rows
  # alongside matrix-agent's LLM predictions; reflection scores them together
  # and proposes mutations per strategy_id. Paper-trade only — execution gate
  # in services/execution still enforces no-live-without-paper-cert.
  strategy:
    build:
      <<: *python-build
      target: runtime
      args:
        SERVICE: strategy
    image: matrix-strategy:local
    container_name: matrix-strategy
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *python-env
    command: ["strategy.main", "--interval", "30"]
    restart: unless-stopped
    logging: *default_logging

  backtest:
    build:
      <<: *python-build
      target: runtime
      args:
        SERVICE: backtest
    image: matrix-backtest:local
    container_name: matrix-backtest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *python-env
    command: ["backtest.main", "--interval", "5"]
    restart: unless-stopped
    logging: *default_logging

  # HTTP wrapper around historical.run_backtest for the dashboard's deploy
  # preview. Same image as the daemon; just a different command. Internal
  # only — not exposed on host. The web service hits it as http://backtest-api:8010.
  backtest-api:
    image: matrix-backtest:local
    container_name: matrix-backtest-api
    depends_on:
      postgres:
        condition: service_healthy
      backtest:
        condition: service_started
    environment:
      <<: *python-env
    command: ["backtest.api"]
    restart: unless-stopped
    logging: *default_logging

  reflection:
    build:
      <<: *python-build
      target: runtime
      args:
        SERVICE: reflection
    image: matrix-reflection:local
    container_name: matrix-reflection
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *python-env
    command: ["reflection.main", "--interval", "600", "--no-llm"]
    restart: unless-stopped
    logging: *default_logging

  labs:
    build:
      <<: *python-build
      target: runtime
      args:
        SERVICE: labs
    image: matrix-labs:local
    container_name: matrix-labs
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *python-env
      AUTO_APPLY_MIN_FITNESS: "0.10"
    command:
      - "labs.main"
      - "--eval-interval"
      - "20"
      - "--evolve-interval"
      - "300"
      - "--promote-scan-interval"
      - "600"
      - "--auto-apply-safe"
    restart: unless-stopped
    logging: *default_logging

  synthesis:
    build:
      <<: *python-build
      target: runtime
      args:
        SERVICE: synthesis
    image: matrix-synthesis:local
    container_name: matrix-synthesis
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *python-env
    command: ["synthesis.main", "--interval", "3600", "--hours", "6"]
    restart: unless-stopped
    # Hourly theme synthesis writes Concept nodes consumed by matrix_agent's
    # feature extraction and the bulletin compose step. Both consumers are
    # either gated (bulletin → Phase 6) or rule-dominated (matrix_agent
    # feature space mostly uses graph mention counts, not narrative themes),
    # so this is idle LLM burn for the survivor strategy set. Re-enable with
    # `docker compose --profile phase6 up -d synthesis` when bulletin returns.
    profiles: ["phase6"]
    logging: *default_logging

  dev_agent:
    build:
      <<: *python-build
      target: runtime
      args:
        SERVICE: dev_agent
    image: matrix-dev_agent:local
    container_name: matrix-dev-agent
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *python-env
      # dev_agent's spawned `claude` CLI picks its auth mode from env:
      #   - CLAUDE_CODE_OAUTH_TOKEN set → Claude Code subscription (dev default)
      #   - ANTHROPIC_API_KEY set       → Anthropic API billing (prod default)
      # Operator chooses by setting one in .env. (ANTHROPIC_API_KEY is already
      # inherited via *python-env.) Set CLAUDE_CODE_OAUTH_TOKEN with the value
      # produced by running `claude setup-token` on the host.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      DEV_AGENT_PARALLEL: ${DEV_AGENT_PARALLEL:-2}
      DEV_AGENT_DAILY_COST_CAP_USD: ${DEV_AGENT_DAILY_COST_CAP_USD:-50}
      DEV_AGENT_TASK_COST_CAP_USD: ${DEV_AGENT_TASK_COST_CAP_USD:-5}
      DEV_AGENT_REPO_ROOT: /workspace
      DEV_AGENT_WORKTREE_ROOT: /workspace/worktrees/dev-agent
    # Host port removed to avoid collisions with other local projects on 8009.
    # Reach via OrbStack proxy at the custom domain set by the label below.
    expose:
      - "8009"
    labels:
      dev.orbstack.domains: "agent.matrix.local"
      dev.orbstack.http-port: "8009"
    volumes:
      # Repo root RW-mounted so dev_agent can create worktrees on the host filesystem.
      - .:/workspace
      - ./worktrees:/workspace/worktrees
    command: ["dev_agent.main"]
    restart: unless-stopped
    logging: *default_logging

  brain:
    build:
      <<: *python-build
      target: runtime
      args:
        SERVICE: brain
    image: matrix-brain:local
    container_name: matrix-brain
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *python-env
      # Read-only "ask anything" agent. Spawns the `claude` CLI via the SDK, so
      # it runs on subscription auth (CLAUDE_CODE_OAUTH_TOKEN) like dev_agent.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      BRAIN_PORT: "3032"
      # Default Sonnet 4.6 — Opus on every chat turn (incl. trivial ones) drains
      # the subscription rate budget the trading loop also draws from. Set
      # BRAIN_MODEL=claude-opus-4-7 in .env for global Opus, or pass
      # {"model":"claude-opus-4-7"} per-request for one-off hard questions.
      BRAIN_MODEL: ${BRAIN_MODEL:-claude-sonnet-4-6}
      BRAIN_MAX_TURNS: ${BRAIN_MAX_TURNS:-12}
      AGENT_MAX_CONCURRENCY: ${AGENT_MAX_CONCURRENCY:-3}
    expose:
      - "3032"
    labels:
      dev.orbstack.domains: "brain.matrix.local"
      dev.orbstack.http-port: "3032"
    command: ["brain.main"]
    restart: unless-stopped
    logging: *default_logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    image: matrix-web:local
    container_name: matrix-web
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3030"
      HOSTNAME: "0.0.0.0"
      # SHARED tier (predictions, wallet, lab, graph_signals)
      DATABASE_URL: ${SHARED_DATABASE_URL:-postgres://matrix:matrix_dev_only@postgres:5432/matrix}
      # LOCAL tier (market data, raw_documents, AGE graph entity counts)
      LOCAL_DATABASE_URL: ${LOCAL_DATABASE_URL:-postgres://matrix:matrix_dev_only@postgres:5432/matrix}
    # Host port removed to avoid collisions with other local projects on 3030.
    # Reach via OrbStack proxy at the custom domain set by the label below.
    expose:
      - "3030"
    labels:
      dev.orbstack.domains: "matrix.local"
      dev.orbstack.http-port: "3030"
    restart: unless-stopped
    logging: *default_logging

volumes:
  matrix_pgdata:
    name: matrix_pgdata

networks:
  default:
    name: matrix-net

[project]
name = "matrix-db"
version = "0.0.1"
description = "Alembic migrations for Matrix Postgres schema."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14.0",
    "matrix-shared",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
]

[tool.uv.sources]
matrix-shared = { path = "../../packages/python-shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# alembic-only package, no library code
bypass-selection = true
